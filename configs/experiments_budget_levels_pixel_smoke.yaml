# =====================================================================================
# CHEAP AND MID BUDGET LEVELS on the pixel priors at t0 = 1.0 -- 2-image SMOKE variant
# =====================================================================================
#
# Generated by scripts/make_budget_level_config.py; do not edit by hand.
#
#   python run.py --config configs/experiments_budget_levels_pixel_smoke.yaml --run-id <id> --no-figures
#   bash submit.sh --array 4 --config configs/experiments_budget_levels_pixel_smoke.yaml --gpu h100:1 --time <HH:MM:SS>
#
# The backprop methods get the measured time of the cheap methods (cheap level) and 4x
# that (mid level, no deblurring).  Each entry starts from its prior's own entry (the
# comment names it) and changes ONLY the step knob; every other field and the benchmark
# batch size are kept.  The step values were computed from per-image times measured on
# the cluster (scripts/run_timing.py) and are fixed here.  66 entries (36 cheap, 30 mid).
# Entries whose benchmark batch size differs from D-Flow's on that prior sit in
# <task>__budget_<level>_rhc (MPC-RHC) or <task>__budget_<level>_rhso (JiT RHSO).
#
# Step values (-- = no new run): RHSO (num_rhso_steps, num_opt_steps), MPC-delta_t
# n_ctrl, D-Flow num_opt_steps, MPC-RHC n_ctrl.
#                                     RHSO   MPC-dt   D-Flow  MPC-RHC
#   cheap pmf  denoising            (4, 1)        1        6        1
#   cheap pmf  deblur               (8, 8)        9       69       --
#   cheap pmf  super_resolution     (4, 1)        1        7        1
#   cheap pmf  random_inpaint       (4, 1)        1        6        1
#   cheap pmf  box_inpaint          (8, 1)        1        8       --
#   cheap jit  denoising            (7, 2)        3       25        6
#   cheap jit  deblur              (8, 12)       14      103       --
#   cheap jit  super_resolution     (4, 5)        3       24        5
#   cheap jit  random_inpaint       (7, 2)        3       25        6
#   cheap jit  box_inpaint          (4, 5)        3       25       --
#   mid   pmf  denoising            (4, 7)        4       27        6
#   mid   pmf  super_resolution     (4, 7)        4       29        3
#   mid   pmf  random_inpaint       (4, 7)        3       27        3
#   mid   pmf  box_inpaint          (8, 4)        4       34       --
#   mid   jit  denoising           (7, 13)       14      102       25
#   mid   jit  super_resolution    (4, 23)       13       99       24
#   mid   jit  random_inpaint      (7, 14)       14      102       25
#   mid   jit  box_inpaint         (4, 24)       14      101       --
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 96
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  pmf: {}
  jit:
    variant: JiT-B/16
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising__budget_cheap:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 1, lr: 0.03, mu: 1}   # source: configs/experiments_final_frozen100.yaml :: denoising__rhso / pmf / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 4 -> 4, num_opt_steps 40 -> 1
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 1, lam: 30, lr: 0.15}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 20 -> 1
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 6, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / dflow; cheap level (the cheap methods' measured time); num_opt_steps 320 -> 6
      jit:
        batch_size: 20
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 3, lam: 30, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 20 -> 3
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 25, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 25

  denoising__budget_cheap_rhc:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 1, K: 2, lam: 30, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: denoising__rhc / pmf / mpc_rhc; cheap level (the cheap methods' measured time); n_ctrl 40 -> 1
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 6, K: 2, lam: 15, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: denoising__rhc / jit / mpc_rhc; cheap level (the cheap methods' measured time); n_ctrl 40 -> 6

  denoising__budget_cheap_rhso:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 7, num_opt_steps: 2, lr: 0.01, mu: 1}   # source: configs/experiments_matched_frozen100.yaml :: denoising__rhso_matched / jit / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 7 -> 7, num_opt_steps 20 -> 2

  deblurring__budget_cheap:
    enabled: true
    problem: deblur
    num_images: 2
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 8, lr: 0.01, mu: 0}   # source: configs/experiments_final_frozen100.yaml :: deblurring__rhso / pmf / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 8 -> 8, num_opt_steps 20 -> 8
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 9, lam: 1000, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / pmf / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 40 -> 9
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 69, lr: 0.03}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / pmf / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 69
      jit:
        batch_size: 20
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 14, lam: 1000, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / jit / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 40 -> 14
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 103, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / jit / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 103

  deblurring__budget_cheap_rhso:
    enabled: true
    problem: deblur
    num_images: 2
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 8, num_opt_steps: 12, lr: 0.005, mu: 0}   # source: configs/experiments_matched_frozen100.yaml :: deblurring__rhso_matched / jit / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 8 -> 8, num_opt_steps 35 -> 12

  super_resolution__budget_cheap:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 1, lr: 0.01, mu: 0.2}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__rhso / pmf / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 4 -> 4, num_opt_steps 40 -> 1
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 1, lam: 360, lr: 0.15}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / pmf / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 40 -> 1
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 7, lr: 0.03}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / pmf / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 7
      jit:
        batch_size: 20
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 3, lam: 540, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / jit / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 40 -> 3
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 24, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / jit / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 24

  super_resolution__budget_cheap_rhc:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 1, K: 3, lam: 180, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__rhc / pmf / mpc_rhc; cheap level (the cheap methods' measured time); n_ctrl 40 -> 1
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 5, K: 2, lam: 720, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__rhc / jit / mpc_rhc; cheap level (the cheap methods' measured time); n_ctrl 40 -> 5

  super_resolution__budget_cheap_rhso:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 4, num_opt_steps: 5, lr: 0.005, mu: 0.2}   # source: configs/experiments_matched_frozen100.yaml :: super_resolution__rhso_matched / jit / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 4 -> 4, num_opt_steps 70 -> 5

  random_inpainting__budget_cheap:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.7}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 1, lr: 0.01, mu: 0}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__rhso / pmf / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 4 -> 4, num_opt_steps 40 -> 1
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 1, lam: 360, lr: 0.15}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__core / pmf / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 40 -> 1
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 6, lr: 0.03}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__core / pmf / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 6
      jit:
        batch_size: 20
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 3, lam: 1000, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__core / jit / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 20 -> 3
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 25, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__core / jit / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 25

  random_inpainting__budget_cheap_rhc:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.7}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 1, K: 3, lam: 180, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__rhc / pmf / mpc_rhc; cheap level (the cheap methods' measured time); n_ctrl 40 -> 1
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 6, K: 2, lam: 240, lr: 0.02}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__rhc / jit / mpc_rhc; cheap level (the cheap methods' measured time); n_ctrl 40 -> 6

  random_inpainting__budget_cheap_rhso:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.7}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 7, num_opt_steps: 2, lr: 0.01, mu: 0}   # source: configs/experiments_matched_frozen100.yaml :: random_inpainting__rhso_matched / jit / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 7 -> 7, num_opt_steps 20 -> 2

  box_inpainting__budget_cheap:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 1, lr: 0.01, mu: 0}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__rhso / pmf / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 8 -> 8, num_opt_steps 20 -> 1
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 1, lam: 180, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__core / pmf / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 40 -> 1
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 8, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__core / pmf / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 8
      jit:
        batch_size: 20
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 3, lam: 180, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__core / jit / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 20 -> 3
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 25, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__core / jit / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 25

  box_inpainting__budget_cheap_rhso:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 4, num_opt_steps: 5, lr: 0.01, mu: 0}   # source: configs/experiments_matched_frozen100.yaml :: box_inpainting__rhso_matched / jit / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 4 -> 4, num_opt_steps 35 -> 5

  denoising__budget_mid:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 7, lr: 0.03, mu: 1}   # source: configs/experiments_final_frozen100.yaml :: denoising__rhso / pmf / rhso; mid level (4x the cheap level's time); num_rhso_steps 4 -> 4, num_opt_steps 40 -> 7
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 4, lam: 30, lr: 0.15}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / mpc_delta_t; mid level (4x the cheap level's time); n_ctrl 20 -> 4
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 27, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / dflow; mid level (4x the cheap level's time); num_opt_steps 320 -> 27
      jit:
        batch_size: 20
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 14, lam: 30, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / mpc_delta_t; mid level (4x the cheap level's time); n_ctrl 20 -> 14
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 102, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / dflow; mid level (4x the cheap level's time); num_opt_steps 640 -> 102

  denoising__budget_mid_rhc:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 6, K: 2, lam: 30, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: denoising__rhc / pmf / mpc_rhc; mid level (4x the cheap level's time); n_ctrl 40 -> 6
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 25, K: 2, lam: 15, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: denoising__rhc / jit / mpc_rhc; mid level (4x the cheap level's time); n_ctrl 40 -> 25

  denoising__budget_mid_rhso:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 7, num_opt_steps: 13, lr: 0.01, mu: 1}   # source: configs/experiments_matched_frozen100.yaml :: denoising__rhso_matched / jit / rhso; mid level (4x the cheap level's time); num_rhso_steps 7 -> 7, num_opt_steps 20 -> 13

  super_resolution__budget_mid:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 7, lr: 0.01, mu: 0.2}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__rhso / pmf / rhso; mid level (4x the cheap level's time); num_rhso_steps 4 -> 4, num_opt_steps 40 -> 7
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 4, lam: 360, lr: 0.15}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / pmf / mpc_delta_t; mid level (4x the cheap level's time); n_ctrl 40 -> 4
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 29, lr: 0.03}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / pmf / dflow; mid level (4x the cheap level's time); num_opt_steps 640 -> 29
      jit:
        batch_size: 20
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 13, lam: 540, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / jit / mpc_delta_t; mid level (4x the cheap level's time); n_ctrl 40 -> 13
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 99, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / jit / dflow; mid level (4x the cheap level's time); num_opt_steps 640 -> 99

  super_resolution__budget_mid_rhc:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 3, K: 3, lam: 180, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__rhc / pmf / mpc_rhc; mid level (4x the cheap level's time); n_ctrl 40 -> 3
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 24, K: 2, lam: 720, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__rhc / jit / mpc_rhc; mid level (4x the cheap level's time); n_ctrl 40 -> 24

  super_resolution__budget_mid_rhso:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 4, num_opt_steps: 23, lr: 0.005, mu: 0.2}   # source: configs/experiments_matched_frozen100.yaml :: super_resolution__rhso_matched / jit / rhso; mid level (4x the cheap level's time); num_rhso_steps 4 -> 4, num_opt_steps 70 -> 23

  random_inpainting__budget_mid:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.7}
    models:
      pmf:
        batch_size: 10
