# =====================================================================================
# MATCHED-TIME on the pixel priors at t0 = 1.0 -- 2-image SMOKE variant
# =====================================================================================
#
# Generated by scripts/make_matched_time_config.py; do not edit by hand.
#
#   python run.py --config configs/experiments_matched_time_pixel_smoke.yaml --run-id <id> --no-figures
#   bash submit.sh --array 4 --config configs/experiments_matched_time_pixel_smoke.yaml --gpu h100:1 --time <HH:MM:SS>
#
# Every method gets the wall-clock per image that RHSO takes on the same prior and
# task.  Each entry starts from its prior's own frozen entry (the comment names it) and
# changes ONLY the method's budget knob; every other field and the benchmark batch size
# are kept.  The knob values were computed from per-image times measured on the
# cluster (scripts/run_timing.py) and are fixed here.  33 entries.
# MPC-RHC ran at its own benchmark batch size, so it sits in <task>__matched_time_rhc.
#
# Knob values (-- = no new run): PnP-Flow num_pnp_steps, Flower num_flower_steps, D-Flow num_opt_steps, MPC-RHC n_ctrl.
#                               PnP   Flower   D-Flow  MPC-RHC
#   pmf  denoising              978     1218      155       --
#   pmf  deblur                 513       13      162       --
#   pmf  super_resolution       962     1240      168       20
#   pmf  random_inpaint         888     1210      151       18
#   pmf  box_inpaint           1053     1155      166       --
#   jit  denoising              312      323      145       --
#   jit  deblur                 606      171      286       --
#   jit  super_resolution       600      636      287       71
#   jit  random_inpaint         309      324      145       --
#   jit  box_inpaint            309      321      143       --
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  pmf: {}
  jit:
    variant: JiT-B/16
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising__matched_time:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 10
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 978, gamma0: 200000.0, alpha: 0.1}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / pnp; num_pnp_steps 10 -> 978, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 1218}   # source: configs/experiments_flower_frozen100.yaml :: denoising__flower / pmf / flower; num_flower_steps 50 -> 1218, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 155, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / dflow; num_opt_steps 320 -> 155, matched to RHSO's measured time
      jit:
        batch_size: 20
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 312, gamma0: 200000.0, alpha: 0.5}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / pnp; num_pnp_steps 50 -> 312, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 323}   # source: configs/experiments_flower_frozen100.yaml :: denoising__flower / jit / flower; num_flower_steps 50 -> 323, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 145, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / dflow; num_opt_steps 640 -> 145, matched to RHSO's measured time

  deblurring__matched_time:
    enabled: true
    problem: deblur
    num_images: 2
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 10
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 513, gamma0: 5000000.0, alpha: 1}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / pmf / pnp; num_pnp_steps 200 -> 513, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 13, flower_cg_max_iters: 100}   # source: configs/experiments_flower_frozen100.yaml :: deblurring__flower / pmf / flower; num_flower_steps 50 -> 13, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 162, lr: 0.03}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / pmf / dflow; num_opt_steps 640 -> 162, matched to RHSO's measured time
      jit:
        batch_size: 20
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 606, gamma0: 1200000.0, alpha: 0.5}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / jit / pnp; num_pnp_steps 200 -> 606, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 171, flower_cg_max_iters: 50}   # source: configs/experiments_flower_frozen100.yaml :: deblurring__flower / jit / flower; num_flower_steps 50 -> 171, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 286, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / jit / dflow; num_opt_steps 640 -> 286, matched to RHSO's measured time

  super_resolution__matched_time:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 10
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 962, gamma0: 100000.0, alpha: 0.1}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / pmf / pnp; num_pnp_steps 20 -> 962, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 1240}   # source: configs/experiments_flower_frozen100.yaml :: super_resolution__flower / pmf / flower; num_flower_steps 50 -> 1240, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 168, lr: 0.03}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / pmf / dflow; num_opt_steps 640 -> 168, matched to RHSO's measured time
      jit:
        batch_size: 20
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 600, gamma0: 200000.0, alpha: 0.25}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / jit / pnp; num_pnp_steps 20 -> 600, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 636}   # source: configs/experiments_flower_frozen100.yaml :: super_resolution__flower / jit / flower; num_flower_steps 50 -> 636, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 287, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__core / jit / dflow; num_opt_steps 640 -> 287, matched to RHSO's measured time

  super_resolution__matched_time_rhc:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 20, K: 3, lam: 180, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__rhc / pmf / mpc_rhc; n_ctrl 40 -> 20, matched to RHSO's measured time
      jit:
        batch_size: 10
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 71, K: 2, lam: 720, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: super_resolution__rhc / jit / mpc_rhc; n_ctrl 40 -> 71, matched to RHSO's measured time

  random_inpainting__matched_time:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.7}
    models:
      pmf:
        batch_size: 10
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 888, gamma0: 100000.0, alpha: 0.1}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__core / pmf / pnp; num_pnp_steps 20 -> 888, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 1210}   # source: configs/experiments_flower_frozen100.yaml :: random_inpainting__flower / pmf / flower; num_flower_steps 50 -> 1210, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 151, lr: 0.03}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__core / pmf / dflow; num_opt_steps 640 -> 151, matched to RHSO's measured time
      jit:
        batch_size: 20
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 309, gamma0: 100000.0, alpha: 0.1}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__core / jit / pnp; num_pnp_steps 50 -> 309, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 324}   # source: configs/experiments_flower_frozen100.yaml :: random_inpainting__flower / jit / flower; num_flower_steps 50 -> 324, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 145, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__core / jit / dflow; num_opt_steps 640 -> 145, matched to RHSO's measured time

  random_inpainting__matched_time_rhc:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.7}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 18, K: 3, lam: 180, lr: 0.05}   # source: configs/experiments_final_frozen100.yaml :: random_inpainting__rhc / pmf / mpc_rhc; n_ctrl 40 -> 18, matched to RHSO's measured time

  box_inpainting__matched_time:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 10
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 1053, gamma0: 200000.0, alpha: 0.1}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__core / pmf / pnp; num_pnp_steps 50 -> 1053, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 1155}   # source: configs/experiments_flower_frozen100.yaml :: box_inpainting__flower / pmf / flower; num_flower_steps 50 -> 1155, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 166, lr: 0.1}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__core / pmf / dflow; num_opt_steps 640 -> 166, matched to RHSO's measured time
      jit:
        batch_size: 20
        methods:
          pnp:         {t0: 1.0, num_pnp_steps: 309, gamma0: 200000.0, alpha: 0.1}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__core / jit / pnp; num_pnp_steps 50 -> 309, matched to RHSO's measured time
          flower:      {t0: 1.0, num_flower_steps: 321}   # source: configs/experiments_flower_frozen100.yaml :: box_inpainting__flower / jit / flower; num_flower_steps 50 -> 321, matched to RHSO's measured time
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 143, lr: 0.3}   # source: configs/experiments_final_frozen100.yaml :: box_inpainting__core / jit / dflow; num_opt_steps 640 -> 143, matched to RHSO's measured time
