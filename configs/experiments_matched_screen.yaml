      jit:
        batch_size: 4
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 4, num_opt_steps: 35, lr: [0.005, 0.01, 0.02, 0.03, 0.05, 0.1], mu: [0, 0.2, 1]}   # BP 140 = 4*35; 18 jobs
