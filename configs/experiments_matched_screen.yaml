# =====================================================================================
# MATCHED-BUDGET SCREEN: RHSO vs MPC-delta_t at 4 images
# =====================================================================================
#
#   python run.py --config configs/experiments_matched_screen.yaml --models <prior> --run-id matched_<prior> --no-figures
#   one prior per job: every block carries per-model entries, and --models drops the rest
#
# Screening grid for the matched-budget comparison of RHSO and MPC-delta_t.  Every
# block holds ONE budget-defining pair -- (N, M) for RHSO, (N, C) for MPC-delta_t -- and its
# name gives the backprops per image it was built for.  The target of each (prior, task) cell
# is that prior's own frozen MPC-delta_t budget in configs/experiments_final_frozen100.yaml (direction A), or
# its own frozen RHSO budget (direction B, MPC-delta_t on pmf).  RHSO
# tunes lr and mu, MPC-delta_t tunes lam and lr, over the pre-registered values in
# configs/experiments_hpo_grid.yaml.  JiT and SiT plan with `rhso_terminal_mode: direct`, so RHSO's
# BP is N*M on every prior.  Selection: lowest LPIPS on 8 tuning images inside this grid
# (scripts/hpo.py propose --lock ..., then scripts/make_matched_configs.py freeze).
# Generated by scripts/make_matched_configs.py screen; 960 atomic jobs over all four priors.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 1088
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Written by scripts/build_local_imagenet_pool.py; point it at your copy.
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  jit:
    variant: JiT-B/16
  sit: {}
  pmf: {}
  imf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

