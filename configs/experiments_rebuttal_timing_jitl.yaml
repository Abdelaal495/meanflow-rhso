# =====================================================================================
# REBUTTAL TIMING AND PEAK MEMORY -- JiT-L/16
# =====================================================================================
#
# Generated by scripts/make_paper_timing_configs.py; do not edit by hand.
#
# JiT-L/16 (PyTorch, BF16 network): 7 methods x 5 tasks, batch size 1, 3 images, measured
# as in rebuttal Task 1.  PnP-Flow, Flower, D-Flow, MPC-RHC and MPC-delta_t use the step
# counts of pMF-L/16's frozen configuration.  RHSO uses the capacity-matched JiT-L/16
# direct-planner entries (B = 160) with pMF-L/16's (N, M), from
# configs/experiments_theory_N_fixedB_final100.yaml, without their theory diagnostics.
# Plain sampling (SDEdit) keeps JiT's own sampler settings: it is the reference, not
# count-matched.  Timing only: quality is not evaluated from this run.
#
#   python scripts/run_timing.py --config configs/experiments_rebuttal_timing_jitl.yaml --run-id timing_jitl
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
  timing_detail: true
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  jit:
    variant: JiT-L/16
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  # timing only: plain sampling with JiT's own sampler settings (the reference, not count-matched); quality is not evaluated from this run
  denoising__sdedit:
    enabled: true
    problem: denoising
    num_images: 3
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          sdedit: {t0: 1.0, solver: heun, steps: 25}

  # timing only: step counts equal to pMF-L/16's frozen configuration; quality is not evaluated from this run
  denoising__pnp:
    enabled: true
    problem: denoising
    num_images: 3
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 10, gamma0: 200000.0, alpha: 0.5}

  # timing only: step counts equal to pMF-L/16's frozen configuration; quality is not evaluated from this run
  denoising__flower:
    enabled: true
    problem: denoising
    num_images: 3
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          flower: {t0: 1.0, num_flower_steps: 50}

  # timing only: step counts equal to pMF-L/16's frozen configuration; quality is not evaluated from this run
