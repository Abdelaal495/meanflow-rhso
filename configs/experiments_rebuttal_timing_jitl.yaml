      jit:
        batch_size: 1
        methods:
          dflow: {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 320, lr: 0.3}

  # timing only: step counts equal to pMF-L/16's frozen configuration; quality is not evaluated from this run
  denoising__mpc_rhc:
    enabled: true
    problem: denoising
    num_images: 3
