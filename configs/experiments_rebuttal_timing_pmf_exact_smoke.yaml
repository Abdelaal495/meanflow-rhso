# =====================================================================================
# REBUTTAL TIMING AND EXACT PEAK MEMORY -- pMF-L/16, SMOKE variant
# =====================================================================================
#
# Generated by scripts/make_paper_timing_configs.py; do not edit by hand.
#
# pMF-L/16 with EXACT JAX peak memory: the same 2 blocks as
# configs/experiments_rebuttal_timing_pmf.yaml (names and fields unchanged; batch size 1,
# 3 images) with models.pmf.param_loading: host_once.  That opt-in loader builds pMF's
# training state and restores the checkpoint on the host and transfers the selected EMA
# parameters to the GPU once, so the model load never sets a JAX allocator peak above
# the resident parameters; each configuration's lifetime peak (one configuration per
# process) is then its exact allocator high-water mark (src/timing.exact_jax_peak).
#
#   python scripts/run_timing.py --config configs/experiments_rebuttal_timing_pmf_exact_smoke.yaml --run-id timing_pmf_exact_smoke
#
# SMOKE: one RHSO and one MPC-delta_t block at the same 3 images as
# timing_pmf, so their PSNR can be compared with timing_pmf's (identical
# parameters); run it WITHOUT run.py's checks (they would allocate inside
# the measured process and void the exact peak).
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
  timing_detail: true
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  pmf:
    param_loading: host_once
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / mpc_delta_t
  denoising__core__mpc_delta_t:
    enabled: true
    problem: denoising
    num_images: 3
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 1
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 30, lr: 0.15}

  # source: configs/experiments_final_frozen100.yaml :: denoising__rhso / pmf / rhso
  denoising__rhso__rhso:
    enabled: true
    problem: denoising
    num_images: 3
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 1
        methods:
          rhso: {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.03, mu: 1}
