# =====================================================================================
# SMOKE: RHSO anchor schedules, frozen entries at 2 images
# =====================================================================================
#
#   python scripts/build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
#   python run.py --config configs/experiments_anchor_schedule_frozen100_smoke.yaml --models pmf --run-id <id> --no-figures
#
# RHSO with a time-dependent state anchor on pMF-L/16 (rebuttal Task 8): mu_k = mu0 * m(t_k),
# constant m = 1, increasing m = (t^2 + (1-t)^2) / (1-t)^2, decreasing = 1 / increasing.
# Each entry is, for its (task, schedule), the lowest-LPIPS mu0 among the schedule's grid
# {0.01, 0.03, 0.1, 0.3, 1, 3, 10} and the task's mu0 = 0 run, on the 8 tuning images of
# pMF-L/16 itself (trailing comment).  N, M, lr, t0 and the degradation are the task's pMF
# __rhso entry of configs/experiments_final_frozen100.yaml; the batch sizes are its pMF ones.
# A block named for several schedules (<task>__anchor_constant_increasing) is one mu0 = 0
# run that each of them selected.  15 (task, schedule) entries in 14 jobs.
# Generated by scripts/freeze_anchor_schedules.py from run_26633159.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Written by scripts/build_local_imagenet_pool.py; point it at your copy.
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  pmf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising__anchor_constant:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.03, mu: 1.0, mu_schedule: constant}   # schedule constant: selected mu0 = 1, tuning LPIPS 0.0930 (PSNR 28.25) at 8 tuning images, best of 8

  denoising__anchor_increasing:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.03, mu: 0.1, mu_schedule: increasing}   # schedule increasing: selected mu0 = 0.1, tuning LPIPS 0.1058 (PSNR 28.38) at 8 tuning images, best of 8

  denoising__anchor_decreasing:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.03, mu: 10.0, mu_schedule: decreasing}   # schedule decreasing: selected mu0 = 10, tuning LPIPS 0.1262 (PSNR 27.04) at 8 tuning images, best of 8

  deblurring__anchor_constant:
    enabled: true
    problem: deblur
    num_images: 2
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0.01, mu_schedule: constant}   # schedule constant: selected mu0 = 0.01, tuning LPIPS 0.1029 (PSNR 29.20) at 8 tuning images, best of 8

  deblurring__anchor_increasing:
    enabled: true
    problem: deblur
    num_images: 2
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0, mu_schedule: constant}   # schedule increasing: selected mu0 = 0, tuning LPIPS 0.1078 (PSNR 29.12) at 8 tuning images, best of 8 (mu0 = 0: the same objective under every schedule; one run)

  deblurring__anchor_decreasing:
    enabled: true
    problem: deblur
    num_images: 2
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0.3, mu_schedule: decreasing}   # schedule decreasing: selected mu0 = 0.3, tuning LPIPS 0.1013 (PSNR 29.26) at 8 tuning images, best of 8

  super_resolution__anchor_constant:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0.3, mu_schedule: constant}   # schedule constant: selected mu0 = 0.3, tuning LPIPS 0.1055 (PSNR 26.59) at 8 tuning images, best of 8

  super_resolution__anchor_increasing:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0.03, mu_schedule: increasing}   # schedule increasing: selected mu0 = 0.03, tuning LPIPS 0.1056 (PSNR 26.68) at 8 tuning images, best of 8

  super_resolution__anchor_decreasing:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 3.0, mu_schedule: decreasing}   # schedule decreasing: selected mu0 = 3, tuning LPIPS 0.1028 (PSNR 26.55) at 8 tuning images, best of 8

  random_inpainting__anchor_constant_increasing:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0, mu_schedule: constant}   # schedule constant: selected mu0 = 0, tuning LPIPS 0.1002 (PSNR 26.92) at 8 tuning images, best of 8; schedule increasing: selected mu0 = 0, tuning LPIPS 0.1002 (PSNR 26.92) at 8 tuning images, best of 8 (mu0 = 0: the same objective under every schedule; one run)

  random_inpainting__anchor_decreasing:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0.3, mu_schedule: decreasing}   # schedule decreasing: selected mu0 = 0.3, tuning LPIPS 0.0961 (PSNR 26.87) at 8 tuning images, best of 8

  box_inpainting__anchor_constant:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0.1, mu_schedule: constant}   # schedule constant: selected mu0 = 0.1, tuning LPIPS 0.0485 (PSNR 28.75) at 8 tuning images, best of 8

  box_inpainting__anchor_increasing:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0, mu_schedule: constant}   # schedule increasing: selected mu0 = 0, tuning LPIPS 0.0546 (PSNR 28.66) at 8 tuning images, best of 8 (mu0 = 0: the same objective under every schedule; one run)

  box_inpainting__anchor_decreasing:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0.3, mu_schedule: decreasing}   # schedule decreasing: selected mu0 = 0.3, tuning LPIPS 0.0440 (PSNR 29.23) at 8 tuning images, best of 8
