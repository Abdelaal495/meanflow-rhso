# =====================================================================================
# REBUTTAL TIMING AND PEAK MEMORY -- JiT-L/16, SMOKE variant
# =====================================================================================
#
# Generated by scripts/make_paper_timing_configs.py; do not edit by hand.
#
# JiT-L/16 (PyTorch, BF16 network): 7 methods x 5 tasks, batch size 1, 2 images, measured
# as in rebuttal Task 1.  PnP-Flow, Flower, D-Flow, MPC-RHC and MPC-delta_t use the step
# counts of pMF-L/16's frozen configuration.  RHSO uses the capacity-matched JiT-L/16
# direct-planner entries (B = 160) with pMF-L/16's (N, M), from
# configs/experiments_theory_N_fixedB_final100.yaml, without their theory diagnostics.
# Plain sampling (SDEdit) keeps JiT's own sampler settings: it is the reference, not
# count-matched.  Timing only: quality is not evaluated from this run.
#
#   python scripts/run_timing.py --config configs/experiments_rebuttal_timing_jitl_smoke.yaml --run-id timing_jitl_smoke
#
# SMOKE: one RHSO and one MPC-delta_t block at 2 images.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
  timing_detail: true
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  jit:
    variant: JiT-L/16
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  # timing only: step counts equal to pMF-L/16's frozen configuration; quality is not evaluated from this run
  denoising__mpc_delta_t:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 30, lr: 0.3}

  # timing only: RHSO, direct planner, capacity-matched JiT-L/16 entry with N = 4, M = 40 (B = 160); quality is not evaluated from this run
  denoising__rhso:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          rhso: {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.005, mu: 0.2, optimizer: adam, solver: heun, rhso_terminal_mode: direct}
