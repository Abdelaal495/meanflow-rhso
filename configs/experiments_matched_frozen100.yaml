# =====================================================================================
# MATCHED-BUDGET FINAL at t0 = 1.0 on the frozen ImageNet-100 (class seed 42 / image seed 43)
# =====================================================================================
#
#   python scripts/build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
#   python run.py --config configs/experiments_matched_frozen100.yaml --models <prior> --run-id <id> --no-figures
#
# Each entry is the lowest-LPIPS configuration of its (prior, task, method) cell among
# the candidates inside that prior's own screened grid, at the cell's own target
# backprops (the trailing comment).  Pair it with the benchmark run of configs/experiments_final_frozen100.yaml
# in scripts/paired_stats.py.
# Generated by scripts/make_matched_configs.py freeze from run_9180965.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Written by scripts/build_local_imagenet_pool.py; point it at your copy.
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  pmf: {}
  jit:
    variant: JiT-B/16

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising__rhso_matched:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 7, num_opt_steps: 20, lr: 0.01, mu: 1}   # BP 140; LPIPS 0.1015 PSNR 28.28 at 8 tuning images, best of 3
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 35, lr: 0.05, mu: 1}   # BP 140; LPIPS 0.0928 PSNR 28.26 at 8 tuning images, best of 3

  denoising__mpc_delta_t_matched:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 10
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 5, n_ctrl: 40, lam: 30, lr: 0.15}   # BP 160; LPIPS 0.1800 PSNR 26.58 at 8 tuning images, best of 3

  deblurring__rhso_matched:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 8, num_opt_steps: 35, lr: 0.005, mu: 0}   # BP 280; LPIPS 0.1223 PSNR 28.75 at 8 tuning images, best of 3
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 70, lr: 0.01, mu: 0}   # BP 280; LPIPS 0.0831 PSNR 29.05 at 8 tuning images, best of 3

  deblurring__mpc_delta_t_matched:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 10
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 9, n_ctrl: 20, lam: 1000, lr: 0.15}   # BP 160; LPIPS 0.1342 PSNR 28.70 at 8 tuning images, best of 3

  super_resolution__rhso_matched:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 4, num_opt_steps: 70, lr: 0.005, mu: 0.2}   # BP 280; LPIPS 0.1076 PSNR 26.25 at 8 tuning images, best of 3
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 35, lr: 0.01, mu: 1}   # BP 280; LPIPS 0.0960 PSNR 26.59 at 8 tuning images, best of 3

  super_resolution__mpc_delta_t_matched:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 10
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 9, n_ctrl: 20, lam: 540, lr: 0.15}   # BP 160; LPIPS 0.0962 PSNR 26.64 at 8 tuning images, best of 3

  random_inpainting__rhso_matched:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 7, num_opt_steps: 20, lr: 0.01, mu: 0}   # BP 140; LPIPS 0.0984 PSNR 26.40 at 8 tuning images, best of 3
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 35, lr: 0.02, mu: 1}   # BP 280; LPIPS 0.0940 PSNR 26.67 at 8 tuning images, best of 3

  random_inpainting__mpc_delta_t_matched:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 10
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 9, n_ctrl: 20, lam: 540, lr: 0.3}   # BP 160; LPIPS 0.0863 PSNR 27.04 at 8 tuning images, best of 3

  box_inpainting__rhso_matched:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      jit:
        batch_size: 8
        methods:
          rhso:        {t0: 1.0, solver: heun, rhso_terminal_mode: direct, num_rhso_steps: 4, num_opt_steps: 35, lr: 0.01, mu: 0}   # BP 140; LPIPS 0.0981 PSNR 28.41 at 8 tuning images, best of 3
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 35, lr: 0.01, mu: 0.2}   # BP 280; LPIPS 0.0444 PSNR 29.74 at 8 tuning images, best of 3

  box_inpainting__mpc_delta_t_matched:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 10
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 9, n_ctrl: 20, lam: 180, lr: 0.1}   # BP 160; LPIPS 0.0510 PSNR 29.24 at 8 tuning images, best of 3
