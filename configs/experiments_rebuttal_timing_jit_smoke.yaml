# =====================================================================================
# REBUTTAL TIMING AND PEAK MEMORY -- jit, 2-image SMOKE variant
# =====================================================================================
#
# Generated by scripts/make_timing_config.py; do not edit by hand.
#
#   python scripts/run_timing.py --config configs/experiments_rebuttal_timing_jit_smoke.yaml --run-id <id>
#
# One block per (task, method) entry of the three frozen configurations:
#   configs/experiments_final_frozen100.yaml
#   configs/experiments_flower_frozen100.yaml
#   configs/experiments_matched_frozen100.yaml
# Each block's comment names the source configuration and entry it was copied
# from.  The entry is copied field for field; only num_images (2) and batch_size (1)
# differ.  Nothing is merged across tasks.
# No two source entries are identical in every field, so none was merged.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
  timing_detail: true
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  jit:
    variant: JiT-B/16
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / sdedit
  denoising__core__sdedit:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          sdedit: {t0: 1.0, solver: heun, steps: 25}

  # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / pnp
  denoising__core__pnp:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 50, gamma0: 200000.0, alpha: 0.5}

  # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / dflow
  denoising__core__dflow:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          dflow: {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 640, lr: 0.3}

  # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / mpc_delta_t
  denoising__core__mpc_delta_t:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 20, lam: 30, lr: 0.3}

  # source: configs/experiments_final_frozen100.yaml :: denoising__rhc / jit / mpc_rhc
  denoising__rhc__mpc_rhc:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.2}
    models:
      jit:
        batch_size: 1
        methods:
          mpc_rhc: {t0: 1.0, num_mpc_steps: 4, n_ctrl: 40, K: 2, lam: 15, lr: 0.05}

  # source: configs/experiments_final_frozen100.yaml :: denoising__rhso / jit / rhso
  denoising__rhso__rhso:
    enabled: true
    problem: denoising
    num_images: 2
