# Generated by scripts/make_timing_config.py; do not edit by hand.
#
#   python scripts/run_timing.py --config configs/experiments_rebuttal_timing_sit.yaml --run-id <id>
#
# One block per (task, method) entry of the three frozen configurations:
#   configs/experiments_final_frozen100.yaml
#   configs/experiments_flower_frozen100.yaml
#   configs/experiments_matched_frozen100.yaml
# Each block's comment names the source configuration and entry it was copied
