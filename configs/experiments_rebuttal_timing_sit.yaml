runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
  timing_detail: true
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  sit: {}
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  # source: configs/experiments_final_frozen100.yaml :: denoising__core / sit / sdedit
  denoising__core__sdedit:
    enabled: true
    problem: denoising
    num_images: 3
    degradation: {sigma: 0.2}
    models:
      sit:
        batch_size: 1
        methods:
          sdedit: {t0: 1.0, solver: heun, steps: 1}

