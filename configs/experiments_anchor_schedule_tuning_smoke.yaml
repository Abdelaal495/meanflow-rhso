# =====================================================================================
# SMOKE: RHSO anchor schedules on pMF, every task at 2 images
# =====================================================================================
#
#   python run.py --config configs/experiments_anchor_schedule_tuning_smoke.yaml --models pmf --run-id <id> --no-figures
#
# Time-dependent state-anchor weight for RHSO on pMF-L/16 (rebuttal Task 8).
# Stage k uses mu_k = mu0 * m(t_k), t_k = grid[k] (0 = noise, 1 = data):
#   constant m = 1;  increasing m = (t^2 + (1-t)^2) / (1-t)^2;  decreasing = 1 / increasing.
# At t0 = 1, beta = 1 the stage times are k/N: N = 4 -> 0, .25, .5, .75 (increasing: 1, 1.11,
# 2, 10); N = 8 -> 0, .125, ..., .875 (increasing: 1, 1.02, 1.11, 1.36, 2, 3.78, 10, 50).
# Grid per task: mu0 in {0.01, 0.03, 0.1, 0.3, 1, 3, 10} x mu_schedule in {constant, increasing, decreasing}
# (<task>__anchor_tune, 21 jobs) plus mu0 = 0 once (<task>__anchor_tune_mu0; every schedule
# gives the same objective at 0): 22 configurations per task.
# Every other field (N, M, lr, t0, degradation) is the task's pMF __rhso entry of
# configs/experiments_final_frozen100.yaml; only mu and mu_schedule vary.
# One round on the first 8 images of the tuning pool, pMF RHSO tuning batch size 4.
# Selection: scripts/freeze_anchor_schedules.py (lowest LPIPS per task and schedule, mu0 = 0
# a candidate of every schedule).
# Generated by scripts/make_anchor_schedule_tuning.py; 20 atomic jobs.
# Smoke variant: mu0 = 1 under each schedule plus mu0 = 0, on 2 images: it
# checks that every task resolves and runs every code path, not which mu0 wins.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Written by scripts/build_local_imagenet_pool.py; point it at your copy.
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  pmf: {}

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising__anchor_tune:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.03, mu: 1, mu_schedule: [constant, increasing, decreasing]}   # 3 jobs; t0/num_rhso_steps/num_opt_steps/lr fields of the frozen pMF entry (frozen mu0 = 1, constant)

  denoising__anchor_tune_mu0:
    enabled: true
    problem: denoising
    num_images: 2
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.03, mu: 0, mu_schedule: constant}   # 1 job; mu0 = 0 is the same objective under every schedule

  deblurring__anchor_tune:
    enabled: true
    problem: deblur
    num_images: 2
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 1, mu_schedule: [constant, increasing, decreasing]}   # 3 jobs; t0/num_rhso_steps/num_opt_steps/lr fields of the frozen pMF entry (frozen mu0 = 0, constant)

  deblurring__anchor_tune_mu0:
    enabled: true
    problem: deblur
    num_images: 2
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0, mu_schedule: constant}   # 1 job; mu0 = 0 is the same objective under every schedule

  super_resolution__anchor_tune:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 1, mu_schedule: [constant, increasing, decreasing]}   # 3 jobs; t0/num_rhso_steps/num_opt_steps/lr fields of the frozen pMF entry (frozen mu0 = 0.2, constant)

  super_resolution__anchor_tune_mu0:
    enabled: true
    problem: super_resolution
    num_images: 2
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0, mu_schedule: constant}   # 1 job; mu0 = 0 is the same objective under every schedule

  random_inpainting__anchor_tune:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 1, mu_schedule: [constant, increasing, decreasing]}   # 3 jobs; t0/num_rhso_steps/num_opt_steps/lr fields of the frozen pMF entry (frozen mu0 = 0, constant)

  random_inpainting__anchor_tune_mu0:
    enabled: true
    problem: random_inpaint
    num_images: 2
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 40, lr: 0.01, mu: 0, mu_schedule: constant}   # 1 job; mu0 = 0 is the same objective under every schedule

  box_inpainting__anchor_tune:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 1, mu_schedule: [constant, increasing, decreasing]}   # 3 jobs; t0/num_rhso_steps/num_opt_steps/lr fields of the frozen pMF entry (frozen mu0 = 0, constant)

  box_inpainting__anchor_tune_mu0:
    enabled: true
    problem: box_inpaint
    num_images: 2
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 2
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 8, num_opt_steps: 20, lr: 0.01, mu: 0, mu_schedule: constant}   # 1 job; mu0 = 0 is the same objective under every schedule
