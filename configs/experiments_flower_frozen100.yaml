# =====================================================================================
# FLOWER FINAL at t0 = 1.0 on the frozen ImageNet-100 (class seed 42 / image seed 43)
# =====================================================================================
#
#   python scripts/build_local_imagenet_pool.py --frozen-manifest benchmarks/imagenet100_c42_i43/manifest.csv
#   python run.py --config configs/experiments_flower_frozen100.yaml --models <prior> --run-id <id> --no-figures
#
# Each entry is the lowest-LPIPS configuration of its (prior, task) cell among
# the candidates inside that prior's own screened grid: num_flower_steps in [50, 100, 200, 500]
# and, for deblurring, flower_cg_max_iters in [50, 100] (the trailing comment).
# gamma = 0 and the CG tolerance 1e-5 throughout.
# Generated by scripts/make_flower_configs.py freeze from run_9175853.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Written by scripts/build_local_imagenet_pool.py; point it at your copy.
  source: local_folder
  local_folder: "cache/data/imagenet100_c42_i43_mirror"
  image_size: 256

models:
  pmf: {}
  jit:
    variant: JiT-B/16

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising__flower:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 10
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50}   # LPIPS 0.1279 PSNR 26.32 at 8 tuning images, best of 3
      jit:
        batch_size: 20
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50}   # LPIPS 0.1103 PSNR 27.45 at 8 tuning images, best of 3

  deblurring__flower:
    enabled: true
    problem: deblur
    num_images: 100
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 10
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50, flower_cg_max_iters: 100}   # LPIPS 0.1257 PSNR 26.89 at 8 tuning images, best of 3
      jit:
        batch_size: 20
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50, flower_cg_max_iters: 50}   # LPIPS 0.1104 PSNR 28.81 at 8 tuning images, best of 3

  super_resolution__flower:
    enabled: true
    problem: super_resolution
    num_images: 100
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 10
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50}   # LPIPS 0.1888 PSNR 23.79 at 8 tuning images, best of 3
      jit:
        batch_size: 20
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50}   # LPIPS 0.1503 PSNR 25.96 at 8 tuning images, best of 3

  random_inpainting__flower:
    enabled: true
    problem: random_inpaint
    num_images: 100
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 10
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50}   # LPIPS 0.1426 PSNR 24.75 at 8 tuning images, best of 3
      jit:
        batch_size: 20
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50}   # LPIPS 0.1025 PSNR 26.61 at 8 tuning images, best of 3

  box_inpainting__flower:
    enabled: true
    problem: box_inpaint
    num_images: 100
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 10
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50}   # LPIPS 0.0461 PSNR 29.56 at 8 tuning images, best of 3
      jit:
        batch_size: 20
        methods:
          flower:      {t0: 1.0, num_flower_steps: 50}   # LPIPS 0.0450 PSNR 30.54 at 8 tuning images, best of 3
