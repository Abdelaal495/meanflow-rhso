# =====================================================================================
# FLOWER SCREEN: pMF-L/16 and JiT-B/16 at 4 images
# =====================================================================================
#
#   python run.py --config configs/experiments_flower_screen.yaml --models <prior> --run-id flower_<prior> --no-figures
#   one prior per job: every block carries per-model entries, and --models drops the rest
#
# Screening grid for Flower (Pourya, El Rawas and Unser, ICLR 2026) on the two pixel
# priors.  One tuned knob, num_flower_steps over the pre-registered [50, 100, 200, 500], at t0 = 1
# with gamma = 0 (the paper's reported setting) and conjugate gradient for deblurring at the
# paper's limits (50 iterations, relative residual 1e-5).  Flower never backpropagates
# through the prior: N network evaluations and 0 backprops per image.  Each prior is
# screened and selected on its own results.  Selection: lowest LPIPS on 8 tuning images
# inside this grid (scripts/hpo.py propose --lock flower=num_flower_steps, then
# scripts/make_flower_configs.py freeze).
# Generated by scripts/make_flower_configs.py screen; 40 atomic jobs over both priors.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: false
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02

data:
  # Written by scripts/build_local_imagenet_pool.py; point it at your copy.
  source: local_folder
  local_folder: "cache/data/imagenet_val_100"
  image_size: 256

models:
  pmf: {}
  jit:
    variant: JiT-B/16

defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false

metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising__flower:
    enabled: true
    problem: denoising
    num_images: 4
    degradation: {sigma: 0.20}
    models:
      pmf:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs
      jit:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs

  deblurring__flower:
    enabled: true
    problem: deblur
    num_images: 4
    degradation: {sigma: 0.05, blur_sigma: 1.0, kernel_size: 7, padding: reflect}
    models:
      pmf:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs
      jit:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs

  super_resolution__flower:
    enabled: true
    problem: super_resolution
    num_images: 4
    degradation: {sigma: 0.05, factor: 2}
    models:
      pmf:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs
      jit:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs

  random_inpainting__flower:
    enabled: true
    problem: random_inpaint
    num_images: 4
    degradation: {sigma: 0.01, missing_fraction: 0.70}
    models:
      pmf:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs
      jit:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs

  box_inpainting__flower:
    enabled: true
    problem: box_inpaint
    num_images: 4
    degradation: {sigma: 0.05, box: 40}
    models:
      pmf:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs
      jit:
        batch_size: 4
        methods:
          flower:      {t0: 1.0, num_flower_steps: [50, 100, 200, 500]}   # N evals, 0 BP per image; 4 jobs
