          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 69, lr: 0.2782608696}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / pmf / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 69; learning rate scaled by tuned/new steps: lr 0.03 x 640/69 -> 0.2782608696; Task 6 entry deblurring__budget_cheap
      jit:
        batch_size: 20
