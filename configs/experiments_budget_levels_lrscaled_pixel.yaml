          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 14, lam: 1000, lr: 0.2857142857}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / jit / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 40 -> 14; learning rate scaled by tuned/new steps: lr 0.1 x 40/14 -> 0.2857142857; Task 6 entry deblurring__budget_cheap
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 103, lr: 1.86407767}   # source: configs/experiments_final_frozen100.yaml :: deblurring__core / jit / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 103; learning rate scaled by tuned/new steps: lr 0.3 x 640/103 -> 1.86407767; Task 6 entry deblurring__budget_cheap

