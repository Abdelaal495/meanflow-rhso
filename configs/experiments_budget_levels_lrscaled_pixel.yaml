# =====================================================================================
# CHEAP AND MID BUDGET LEVELS, LEARNING RATE SCALED, on the pixel priors at t0 = 1.0 on the frozen ImageNet-100 (class seed 42 / image seed 43)
# =====================================================================================
#
# Generated by scripts/make_budget_level_lrscaled_config.py; do not edit by hand.
#
#   python run.py --config configs/experiments_budget_levels_lrscaled_pixel.yaml --run-id <id> --no-figures
#   bash submit.sh --array 4 --config configs/experiments_budget_levels_lrscaled_pixel.yaml --gpu h100:1 --time <HH:MM:SS>
#
# Task 6's 66 entries (configs/experiments_budget_levels_pixel.yaml), every field and batch size unchanged except lr:
#
#     lr_new = lr_tuned x (tuned knob / new knob)
#
# knob: RHSO num_opt_steps (M), MPC-delta_t n_ctrl, D-Flow num_opt_steps, MPC-RHC n_ctrl;
# tuned lr and knob: the entry's source entry (named in its comment).  lr is rounded
# to 10 significant figures.  Blocks are Task 6's names plus "_lr".
# No timing run: lr does not change the time per image; pair these with
# timing_budget_levels via scripts/budget_level_table.py --timing-ignore lr.
#
# Learning rates (4 significant figures; -- = no entry):
#                                     RHSO    MPC-dt    D-Flow   MPC-RHC
#   cheap pmf  denoising               1.2         3     5.333         4
#   cheap pmf  deblur                0.025    0.4444    0.2783        --
#   cheap pmf  super_resolution        0.4         6     2.743         2
#   cheap pmf  random_inpaint          0.4         6       3.2         2
#   cheap pmf  box_inpaint             0.2        12         8        --
#   cheap jit  denoising               0.1         2      7.68    0.3333
#   cheap jit  deblur              0.01458    0.2857     1.864        --
#   cheap jit  super_resolution       0.07    0.6667         8       0.4
#   cheap jit  random_inpaint          0.1    0.3333      7.68    0.1333
#   cheap jit  box_inpaint            0.07    0.6667      7.68        --
#   mid   pmf  denoising            0.1714      0.75     1.185    0.6667
#   mid   pmf  super_resolution    0.05714       1.5    0.6621    0.6667
#   mid   pmf  random_inpaint      0.05714         2    0.7111    0.6667
#   mid   pmf  box_inpaint            0.05         3     1.882        --
#   mid   jit  denoising           0.01538    0.4286     1.882      0.08
#   mid   jit  super_resolution    0.01522    0.1538     1.939   0.08333
#   mid   jit  random_inpaint      0.01429   0.07143     1.882     0.032
#   mid   jit  box_inpaint         0.01458    0.1429     1.901        --
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 96
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  pmf: {}
  jit:
    variant: JiT-B/16
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  denoising__budget_cheap_lr:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 10
        methods:
          rhso:        {t0: 1.0, num_rhso_steps: 4, num_opt_steps: 1, lr: 1.2, mu: 1}   # source: configs/experiments_final_frozen100.yaml :: denoising__rhso / pmf / rhso; cheap level (the cheap methods' measured time); num_rhso_steps 4 -> 4, num_opt_steps 40 -> 1; learning rate scaled by tuned/new steps: lr 0.03 x 40/1 -> 1.2; Task 6 entry denoising__budget_cheap
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 1, lam: 30, lr: 3.0}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 20 -> 1; learning rate scaled by tuned/new steps: lr 0.15 x 20/1 -> 3.0; Task 6 entry denoising__budget_cheap
          dflow:       {t0: 1.0, steps: 1, num_opt_steps: 6, lr: 5.333333333}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / pmf / dflow; cheap level (the cheap methods' measured time); num_opt_steps 320 -> 6; learning rate scaled by tuned/new steps: lr 0.1 x 320/6 -> 5.333333333; Task 6 entry denoising__budget_cheap
      jit:
        batch_size: 20
        methods:
          mpc_delta_t: {t0: 1.0, num_mpc_steps: 8, n_ctrl: 3, lam: 30, lr: 2.0}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / mpc_delta_t; cheap level (the cheap methods' measured time); n_ctrl 20 -> 3; learning rate scaled by tuned/new steps: lr 0.3 x 20/3 -> 2.0; Task 6 entry denoising__budget_cheap
          dflow:       {t0: 1.0, steps: 1, solver: euler, num_opt_steps: 25, lr: 7.68}   # source: configs/experiments_final_frozen100.yaml :: denoising__core / jit / dflow; cheap level (the cheap methods' measured time); num_opt_steps 640 -> 25; learning rate scaled by tuned/new steps: lr 0.3 x 640/25 -> 7.68; Task 6 entry denoising__budget_cheap

  denoising__budget_cheap_rhc_lr:
    enabled: true
    problem: denoising
    num_images: 100
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 5
        methods:
          mpc_rhc:     {t0: 1.0, num_mpc_steps: 4, n_ctrl: 1, K: 2, lam: 30, lr: 4.0}   # source: configs/experiments_final_frozen100.yaml :: denoising__rhc / pmf / mpc_rhc; cheap level (the cheap methods' measured time); n_ctrl 40 -> 1; learning rate scaled by tuned/new steps: lr 0.1 x 40/1 -> 4.0; Task 6 entry denoising__budget_cheap_rhc
      jit:
