# =====================================================================================
# REBUTTAL TIMING -- matched-time entries on pMF and JiT
# =====================================================================================
#
# Generated by scripts/make_matched_time_config.py; do not edit by hand.
#
#   python scripts/run_timing.py --config configs/experiments_rebuttal_timing_matched_time.yaml --run-id timing_matched_time
#   bash submit_timing.sh matched_time --gpu h100:1 --time <HH:MM:SS>
#
# One block per entry of configs/experiments_matched_time_pixel.yaml, so each runs in its own process
# (scripts/run_timing.py) and its time can be checked against RHSO's on the same GPU
# type.  Each block's comment names the quality entry; the entry is copied field for
# field and only num_images (3) and batch_size (1) differ.
# =====================================================================================

runtime:
  seed: 42
  accelerator: auto
  output_root: outputs
  cache_root: cache
  release_model_after_use: true
  continue_on_experiment_error: true
  progress_bars: false
  save_individual_images: true
  verbose: true
  max_atomic_jobs: 64
  resume: true
  replicate: 0
  gpu_memory_profiling: true
  nvml_sample_interval: 0.02
  timing_detail: true
data:
  source: local_folder
  local_folder: cache/data/imagenet100_c42_i43_mirror
  image_size: 256
models:
  pmf: {}
  jit:
    variant: JiT-B/16
defaults:
  control_cost_normalization: sum_squared
  optimizer: adam
  warm_start: false
  grad_clip: null
  record_loss_history: false
metrics:
  lpips: true
  lpips_net: alex

experiments:

  # source: configs/experiments_matched_time_pixel.yaml :: denoising__matched_time / pmf / pnp; configs/experiments_final_frozen100.yaml :: denoising__core / pmf / pnp, matched to RHSO's measured time
  denoising__matched_time__pnp__pmf:
    enabled: true
    problem: denoising
    num_images: 3
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 1
        methods:
          pnp: {t0: 1.0, num_pnp_steps: 978, gamma0: 200000.0, alpha: 0.1}

  # source: configs/experiments_matched_time_pixel.yaml :: denoising__matched_time / pmf / flower; configs/experiments_flower_frozen100.yaml :: denoising__flower / pmf / flower, matched to RHSO's measured time
