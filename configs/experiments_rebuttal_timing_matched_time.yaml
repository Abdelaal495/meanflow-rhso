    problem: denoising
    num_images: 3
    degradation: {sigma: 0.2}
    models:
      pmf:
        batch_size: 1
        methods:
          flower: {t0: 1.0, num_flower_steps: 1218}

  # source: configs/experiments_matched_time_pixel.yaml :: denoising__matched_time / pmf / dflow; configs/experiments_final_frozen100.yaml :: denoising__core / pmf / dflow, matched to RHSO's measured time
